# Mapa del rajo de ejemplo: calibración GPS -> pantalla y posiciones nominales.
# Coordenadas de pantalla normalizadas (x, y en 0..1; origen arriba a la izquierda).
#
# Las coordenadas geográficas son FICTICIAS (corresponden a un punto en pleno océano) y no
# apuntan a ninguna faena real. [calibracion] define qué rectángulo lat/lon ocupa la pantalla:
# para usar un plano georreferenciado propio, reemplazar el fondo y actualizar las cuatro esquinas.

[calibracion]
lat_min = 12.00       # borde inferior de la pantalla (y = 1)
lat_max = 12.12       # borde superior de la pantalla (y = 0)
lon_min = -35.00      # borde izquierdo (x = 0)
lon_max = -34.84      # borde derecho (x = 1)
rotacion_grados = 0
milisegundos_arco_por_grado = 3600000

