    Variant: VariableHeight
    Properties:
      Items: |-
        =With(
            {q: Trim(txtBuscar.Text), r: ddResp.Selected.Value},
            Sort(
                Filter(
                    Actividades,
                    Estado = "Por hacer",
                    IsBlank(q) || q in Actividad || q in ID || q in Area || q in Contraparte || q in StatusActual || q in Bloqueo,
                    r = "Todos los responsables" || (r = "Sin responsable" && IsBlank(Responsable)) || Responsable = r
                ),
                Switch(Prioridad, "Alta", 1, "Media", 2, 3),
                SortOrder.Ascending
            )
        )
      X: =38
      Y: =164
      Width: =242
      Height: =586
      TemplateSize: =80
      TemplatePadding: =0
      ShowScrollbar: =true
