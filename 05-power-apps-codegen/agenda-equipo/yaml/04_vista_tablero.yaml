                          Properties:
                            Fill: =RGBA(255, 255, 255, 1)
                            X: =0
                            Y: =0
                            Width: =(Parent.TemplateWidth - 30)
                            Height: =If(IsBlank(lblSubTPH.Text), lblAreaTPH.Y + lblAreaTPH.Height, lblSubTPH.Y + lblSubTPH.Height) + 8
