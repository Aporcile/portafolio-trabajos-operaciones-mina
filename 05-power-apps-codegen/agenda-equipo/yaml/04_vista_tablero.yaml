                      - btnAvTPH:
                          Control: Classic/Button@2.2.0
                          Properties:
                            Text: =If(IsBlank(ThisItem.Responsable), "?", Coalesce(LookUp(Personas, Nombre = ThisItem.Responsable).Iniciales, Upper(Left(ThisItem.Responsable, 2))))
