- conPanel:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      X: =323
      Y: =68
      Width: =720
      Height: =632
      DropShadow: =DropShadow.ExtraBold
      RadiusTopLeft: =12
      RadiusTopRight: =12
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      BorderColor: =RGBA(219, 225, 233, 1)
      BorderThickness: =1
      Visible: =varPanel
    Children:
          - lblPanelTitulo:
              Control: Label@2.5.1
              Properties:
                Text: =If(varModo = "editar", varAct.Actividad, "Nueva actividad")
                Font: =Font.'Segoe UI'
                Size: =13
                Color: =RGBA(33, 37, 41, 1)
                X: =24
                Y: =18
                Width: =672
                Height: =30
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                PaddingBottom: =0
                FontWeight: =FontWeight.Bold
                Wrap: =false
          - lblNextID:
              Control: Label@2.5.1
              Properties:
                Text: |-
                  =With(
                      {yy: Text(Today(), "yy"), letras: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"},
                      With(
                          {
                              n: Coalesce(
                                  Max(
                                      Filter(Actividades, IsMatch(ID, "[A-Z]-\d{2}-\d{2}") && Right(ID, 2) = yy),
                                      (Find(Left(ID, 1), letras) - 1) * 100 + Value(Mid(ID, 3, 2))
                                  ),
                                  0
                              ) + 1
                          },
                          Mid(letras, RoundDown(n / 100, 0) + 1, 1) & "-" & Text(Mod(n, 100), "00") & "-" & yy
                      )
                  )
                Font: =Font.'Segoe UI'
                Size: =8
                Color: =RGBA(33, 37, 41, 1)
                X: =0
                Y: =0
                Width: =10
                Height: =10
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                PaddingBottom: =0
