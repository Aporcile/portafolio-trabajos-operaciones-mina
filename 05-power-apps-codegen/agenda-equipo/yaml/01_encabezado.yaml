- htmlResumen:
    Control: HtmlViewer@2.1.0
    Properties:
      HtmlText: |-
        ="<div style='font-family:Segoe UI,sans-serif;font-size:13px;color:#cddaeb'>" &
        CountRows(Filter(Actividades, Estado <> "Terminada")) & " activas · " &
        "<b style='color:#b8a8f0'>" & CountRows(Filter(Actividades, Estado = "Bloqueada")) & " bloqueadas</b> · " &
        "<b style='color:#b8a8f0'>" & CountRows(Filter(Actividades, IsBlank(Responsable) && Estado <> "Terminada")) & " sin responsable</b> · " &
        CountRows(Filter(PorRevisar, Decision = "Por decidir")) & " por revisar</div>"
      X: =524
      Y: =15
      Width: =486
      Height: =34
      PaddingTop: =6
      PaddingLeft: =0
- btnActualizar:
    Control: Classic/Button@2.2.0
