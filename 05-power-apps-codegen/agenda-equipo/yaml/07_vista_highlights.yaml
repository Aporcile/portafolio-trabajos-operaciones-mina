      Size: =9.5
      FontWeight: =FontWeight.Semibold
      X: =560
      Y: =130
      Width: =96
      Height: =28
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      Visible: =Coalesce(varVista, "area") = "hl"
- galHH:
    Control: Gallery@2.15.0
    Variant: VariableHeight
    Properties:
      Items: |-
        =With(
            {q: Trim(txtBuscar.Text), r: ddResp.Selected.Value},
            Sort(
                Filter(
                    HighlightsLowlights,
                    Tipo = "Highlight",
                    IsBlank(q) || q in Tema || q in Detalle || q in Impacto || q in Accion,
                    r = "Todos los responsables" || (r = "Sin responsable" && IsBlank(Responsable)) || Responsable = r
                ),
                Fecha,
                SortOrder.Descending
            )
        )
      X: =40
      Y: =168
      Width: =630
      Height: =582
      TemplateSize: =150
      TemplatePadding: =0
      ShowScrollbar: =true
      Fill: =RGBA(0, 0, 0, 0)
      TemplateFill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      Visible: =Coalesce(varVista, "area") = "hl"
      OnSelect: =Set(varHL, ThisItem); Set(varModoHL, "editar"); Select(btnResetHL); Set(varPanelHL, true)
    Children:
                      - conTarjHH:
                          Control: GroupContainer@1.5.0
                          Variant: ManualLayout
                          Properties:
                            Fill: =RGBA(255, 255, 255, 1)
                            X: =0
                            Y: =0
                            Width: =(Parent.TemplateWidth - 30)
                            Height: =lblRespHH.Y + lblRespHH.Height + 10
                            DropShadow: =DropShadow.None
                            RadiusTopLeft: =6
                            RadiusTopRight: =6
                            RadiusBottomLeft: =6
                            RadiusBottomRight: =6
                            BorderColor: =RGBA(219, 225, 233, 1)
                            BorderThickness: =1
                      - lblBarraHH:
                          Control: Label@2.5.1
                          Properties:
                            Text: =""
                            Font: =Font.'Segoe UI'
                            Size: =10
                            Color: =RGBA(33, 37, 41, 1)
                            X: =0
                            Y: =12
                            Width: =3
                            Height: =conTarjHH.Height - 24
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            Fill: =RGBA(46, 125, 50, 1)
                      - lblTemaHH:
                          Control: Label@2.5.1
                          Properties:
                            Text: =ThisItem.Tema
                            Font: =Font.'Segoe UI'
                            Size: =10.5
                            Color: =RGBA(33, 37, 41, 1)
                            X: =16
                            Y: =10
                            Width: =(Parent.TemplateWidth - 30) - 130
                            Height: =20
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            FontWeight: =FontWeight.Bold
                            AutoHeight: =true
                      - lblFechaHH:
                          Control: Label@2.5.1
                          Properties:
                            Text: =If(IsBlank(ThisItem.Fecha), "", Text(DateValue(ThisItem.Fecha), "dd-mm-yyyy"))
                            Font: =Font.'Segoe UI'
                            Size: =8.5
                            Color: =RGBA(108, 117, 125, 1)
                            X: =(Parent.TemplateWidth - 30) - 100
                            Y: =10
                            Width: =88
                            Height: =18
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            Align: =Align.Right
                      - lblDetHH:
                          Control: Label@2.5.1
                          Properties:
                            Text: =Coalesce(ThisItem.Detalle, "Sin detalle")
                            Font: =Font.'Segoe UI'
                            Size: =9
                            Color: =If(IsBlank(ThisItem.Detalle), RGBA(173, 181, 189, 1), RGBA(73, 80, 87, 1))
                            X: =16
                            Y: =lblTemaHH.Y + lblTemaHH.Height + 4
                            Width: =(Parent.TemplateWidth - 30) - 32
                            Height: =20
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            AutoHeight: =true
                      - lblImpHH:
                          Control: Label@2.5.1
                          Properties:
                            Text: |-
                              =If(!IsBlank(ThisItem.Impacto), "Impacto: " & ThisItem.Impacto, "") & If(!IsBlank(ThisItem.Impacto) && !IsBlank(ThisItem.Accion), Char(10), "") & If(!IsBlank(ThisItem.Accion), "Acción: " & ThisItem.Accion, "")
                            Font: =Font.'Segoe UI'
                            Size: =8.5
                            Color: =RGBA(36, 100, 170, 1)
                            X: =16
                            Y: =If(IsBlank(lblImpHH.Text), lblDetHH.Y, lblDetHH.Y + lblDetHH.Height + 6)
                            Width: =(Parent.TemplateWidth - 30) - 32
                            Height: =16
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            AutoHeight: =true
                            Visible: =!IsBlank(lblImpHH.Text)
                      - lblRespHH:
                          Control: Label@2.5.1
                          Properties:
                            Text: =If(IsBlank(ThisItem.Responsable), "Sin responsable", ThisItem.Responsable)
                            Font: =Font.'Segoe UI'
                            Size: =8
                            Color: =If(IsBlank(ThisItem.Responsable), RGBA(150, 100, 0, 1), RGBA(108, 117, 125, 1))
                            X: =16
                            Y: =If(IsBlank(lblImpHH.Text), lblDetHH.Y + lblDetHH.Height, lblImpHH.Y + lblImpHH.Height) + 6
                            Width: =(Parent.TemplateWidth - 30) - 32
                            Height: =16
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            AutoHeight: =true
                      - btnHitHH:
                          Control: Classic/Button@2.2.0
                          Properties:
                            Text: =""
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(27, 42, 65, 0.05)
                            PressedFill: =RGBA(27, 42, 65, 0.10)
                            BorderThickness: =0
                            FocusedBorderThickness: =1
                            FocusedBorderColor: =RGBA(36, 100, 170, 1)
                            OnSelect: =Select(Parent)
                            X: =0
                            Y: =0
                            Width: =(Parent.TemplateWidth - 30)
                            Height: =conTarjHH.Height
                            RadiusTopLeft: =6
                            RadiusTopRight: =6
                            RadiusBottomLeft: =6
                            RadiusBottomRight: =6
                      - recSepHH:
                          Control: Rectangle@2.3.0
                          Properties:
                            Fill: =RGBA(0, 0, 0, 0)
                            X: =0
                            Y: =conTarjHH.Height
                            Width: =10
                            Height: =8
                            OnSelect: =false
- lblVacioHH:
    Control: Label@2.5.1
    Properties:
      Text: ="Sin registros"
      Font: =Font.'Segoe UI'
      Size: =9
      Color: =RGBA(173, 181, 189, 1)
      X: =32
      Y: =180
      Width: =640
      Height: =20
      PaddingLeft: =0
      PaddingRight: =0
      PaddingTop: =0
      PaddingBottom: =0
      Visible: =Coalesce(varVista, "area") = "hl" && CountRows(galHH.AllItems) = 0
      Align: =Align.Center
