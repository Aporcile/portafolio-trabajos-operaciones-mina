- btnAgregarHH:
    Control: Classic/Button@2.2.0
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(33, 37, 41, 1)
      HoverFill: =RGBA(232, 236, 242, 1)
      HoverColor: =RGBA(33, 37, 41, 1)
