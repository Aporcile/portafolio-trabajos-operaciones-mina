                          Properties:
                            Fill: =RGBA(255, 255, 255, 1)
                            Color: =RGBA(33, 37, 41, 1)
                            HoverFill: =RGBA(232, 236, 242, 1)
                            HoverColor: =RGBA(33, 37, 41, 1)
                            PressedFill: =RGBA(232, 236, 242, 1)
                            PressedColor: =RGBA(33, 37, 41, 1)
                            BorderColor: =RGBA(219, 225, 233, 1)
                            HoverBorderColor: =RGBA(170, 182, 198, 1)
                            BorderThickness: =1
