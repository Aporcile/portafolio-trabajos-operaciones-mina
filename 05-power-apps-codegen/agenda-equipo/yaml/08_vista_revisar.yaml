                            OnSelect: |-
                              =Patch(PorRevisar, ThisItem, {Decision: "Descartado"}); If(IsEmpty(Errors(PorRevisar)), Notify("Tema descartado.", NotificationType.Information), Notify("No se pudo actualizar: " & First(Errors(PorRevisar)).Message, NotificationType.Error))
                            Font: =Font.'Segoe UI'
                            Size: =9.5
                            FontWeight: =FontWeight.Semibold
                            X: =(Parent.TemplateWidth - 30) - 130
                            Y: =10
                            Width: =116
