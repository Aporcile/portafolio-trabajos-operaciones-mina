                            OnSelect: |-
                              =Patch(PorRevisar, ThisItem, {Decision: "Pospuesto"}); If(IsEmpty(Errors(PorRevisar)), Notify("Tema pospuesto.", NotificationType.Information), Notify("No se pudo actualizar: " & First(Errors(PorRevisar)).Message, NotificationType.Error))
                            Font: =Font.'Segoe UI'
                            Size: =9.5
                            FontWeight: =FontWeight.Semibold
                            X: =(Parent.TemplateWidth - 30) - 296
                            Y: =50
                            Width: =158
                            Height: =28
                            RadiusTopLeft: =8
                            RadiusTopRight: =8
                            RadiusBottomLeft: =8
                            RadiusBottomRight: =8
                      - recSepRevA:
                          Control: Rectangle@2.3.0
                          Properties:
                            Fill: =RGBA(0, 0, 0, 0)
                            X: =0
                            Y: =conTarjRevA.Height
                            Width: =10
