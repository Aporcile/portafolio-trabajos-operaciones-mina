- galRevA:
    Control: Gallery@2.15.0
    Variant: VariableHeight
    Properties:
      Items: |-
        =With(
            {q: Trim(txtBuscar.Text), r: ddResp.Selected.Value},
            Filter(
                PorRevisar,
                Coalesce(Decision, "Por decidir") = "Por decidir",
                IsBlank(q) || q in Tema || q in Detalle || q in Contraparte,
                r = "Todos los responsables" || (r = "Sin responsable" && IsBlank(ResponsablePropuesto)) || ResponsablePropuesto = r
            )
        )
      X: =38
      Y: =168
      Width: =792
      Height: =582
      TemplateSize: =98
      TemplatePadding: =0
      ShowScrollbar: =true
      Fill: =RGBA(0, 0, 0, 0)
      TemplateFill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      Visible: =Coalesce(varVista, "area") = "revisar"
      OnSelect: =Set(varRev, ThisItem); Set(varModoRev, "editar"); Select(btnResetRev); Set(varPanelRev, true)
    Children:
                      - conTarjRevA:
                          Control: GroupContainer@1.5.0
                          Variant: ManualLayout
                          Properties:
                            Fill: =RGBA(255, 255, 255, 1)
                            X: =0
                            Y: =0
                            Width: =(Parent.TemplateWidth - 30)
                            Height: =Max(lblMetaRevA.Y + lblMetaRevA.Height + 10, 90)
                            DropShadow: =DropShadow.None
                            RadiusTopLeft: =6
                            RadiusTopRight: =6
                            RadiusBottomLeft: =6
                            RadiusBottomRight: =6
                            BorderColor: =RGBA(219, 225, 233, 1)
                            BorderThickness: =1
                      - lblTemaRevA:
                          Control: Label@2.5.1
                          Properties:
                            Text: =ThisItem.Tema
                            Font: =Font.'Segoe UI'
                            Size: =10.5
                            Color: =RGBA(33, 37, 41, 1)
                            X: =14
                            Y: =8
                            Width: =(Parent.TemplateWidth - 30) - 330
                            Height: =20
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            FontWeight: =FontWeight.Bold
                            AutoHeight: =true
                      - lblDetRevA:
                          Control: Label@2.5.1
                          Properties:
                            Text: =Coalesce(ThisItem.Detalle, "Sin detalle")
                            Font: =Font.'Segoe UI'
                            Size: =9
                            Color: =If(IsBlank(ThisItem.Detalle), RGBA(173, 181, 189, 1), RGBA(73, 80, 87, 1))
                            X: =14
                            Y: =lblTemaRevA.Y + lblTemaRevA.Height + 3
                            Width: =(Parent.TemplateWidth - 30) - 330
                            Height: =16
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            AutoHeight: =true
                      - lblMetaRevA:
                          Control: Label@2.5.1
                          Properties:
                            Text: |-
                              =If(IsBlank(ThisItem.Contraparte), "", "Contraparte: " & ThisItem.Contraparte & "  ·  ") & "Propone: " & Coalesce(ThisItem.ResponsablePropuesto, "sin asignar") & If(IsBlank(ThisItem.Fecha), "", "  ·  " & Text(DateValue(ThisItem.Fecha), "dd-mm-yyyy"))
                            Font: =Font.'Segoe UI'
                            Size: =8
                            Color: =RGBA(108, 117, 125, 1)
                            X: =14
                            Y: =lblDetRevA.Y + lblDetRevA.Height + 5
                            Width: =(Parent.TemplateWidth - 30) - 330
                            Height: =16
                            PaddingLeft: =0
                            PaddingRight: =0
                            PaddingTop: =0
                            PaddingBottom: =0
                            AutoHeight: =true
                      - btnHitRevA:
                          Control: Classic/Button@2.2.0
                          Properties:
                            Text: =""
                            Fill: =RGBA(0, 0, 0, 0)
                            HoverFill: =RGBA(27, 42, 65, 0.05)
                            PressedFill: =RGBA(27, 42, 65, 0.10)
                            BorderThickness: =0
                            FocusedBorderThickness: =1
                            FocusedBorderColor: =RGBA(36, 100, 170, 1)
                            OnSelect: =Select(Parent)
                            X: =0
                            Y: =0
                            Width: =(Parent.TemplateWidth - 30) - 310
                            Height: =conTarjRevA.Height
                            RadiusTopLeft: =6
                            RadiusTopRight: =6
                            RadiusBottomLeft: =6
                            RadiusBottomRight: =6
                      - btnCrearRev:
                          Control: Classic/Button@2.2.0
                          Properties:
                            Fill: =RGBA(27, 42, 65, 1)
                            Color: =RGBA(255, 255, 255, 1)
                            HoverFill: =RGBA(44, 66, 98, 1)
                            HoverColor: =RGBA(255, 255, 255, 1)
                            PressedFill: =RGBA(18, 29, 46, 1)
                            PressedColor: =RGBA(255, 255, 255, 1)
                            BorderThickness: =0
                            Text: ="Crear actividad"
                            OnSelect: |-
                              =With(
                                  {
                                      nueva: Patch(
                                          Actividades,
                                          Defaults(Actividades),
                                          {
                                              ID: lblNextID.Text,
                                              Area: "",
                                              Actividad: ThisItem.Tema,
                                              Descripcion: Coalesce(ThisItem.Detalle, ""),
                                              Responsable: Coalesce(ThisItem.ResponsablePropuesto, ""),
                                              Contraparte: Coalesce(ThisItem.Contraparte, ""),
                                              Prioridad: "",
                                              Estado: "Por hacer",
                                              FechaInicio: Text(Today(), "yyyy-mm-dd"),
                                              FechaCompromiso: "",
                                              FechaTermino: "",
                                              StatusActual: "Creada desde Por revisar el " & Text(Today(), "dd-mm-yyyy"),
                                              Bloqueo: ""
                                          }
                                      )
                                  },
                                  If(
                                      IsEmpty(Errors(Actividades)),
                                          Patch(PorRevisar, ThisItem, {Decision: "Aprobado"});
                                          Set(varAct, nueva); Set(varModo, "editar"); Select(btnReset); Set(varPanel, true);
                                          Notify("Actividad creada. Completa área, prioridad y fechas.", NotificationType.Success),
                                          Notify("No se pudo crear la actividad: " & First(Errors(Actividades)).Message, NotificationType.Error)
                                  )
                              )
                            Font: =Font.'Segoe UI'
                            Size: =9.5
                            FontWeight: =FontWeight.Semibold
                            X: =(Parent.TemplateWidth - 30) - 296
                            Y: =10
                            Width: =158
                            Height: =30
                            RadiusTopLeft: =8
                            RadiusTopRight: =8
                            RadiusBottomLeft: =8
                            RadiusBottomRight: =8
                      - btnDescartarRev:
                          Control: Classic/Button@2.2.0
                          Properties:
                            Fill: =RGBA(255, 255, 255, 1)
                            Color: =RGBA(33, 37, 41, 1)
                            HoverFill: =RGBA(232, 236, 242, 1)
                            HoverColor: =RGBA(33, 37, 41, 1)
                            PressedFill: =RGBA(232, 236, 242, 1)
                            PressedColor: =RGBA(33, 37, 41, 1)
                            BorderColor: =RGBA(219, 225, 233, 1)
                            HoverBorderColor: =RGBA(170, 182, 198, 1)
