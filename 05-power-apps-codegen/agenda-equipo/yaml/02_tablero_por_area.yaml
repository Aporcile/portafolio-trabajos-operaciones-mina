                Size: =9
                Color: =RGBA(0, 0, 0, 0)
                X: =4
                Y: =0
                Width: =183
                Height: =17
                PaddingLeft: =0
                PaddingRight: =0
                PaddingTop: =0
                PaddingBottom: =0
                FontWeight: =FontWeight.Bold
                AutoHeight: =true
          - lblMedSPH:
