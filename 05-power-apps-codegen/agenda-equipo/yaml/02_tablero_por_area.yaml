- galAreas:
    Control: Gallery@2.15.0
    Variant: VariableHeight
    Properties:
      Items: |-
        =With(
            {q: Trim(txtBuscar.Text), r: ddResp.Selected.Value},
            Sort(
                Filter(
                    AddColumns(
                        AddColumns(
                            Table(ShowColumns(Sort(Areas, Value(Orden)), Area), {Area: "Sin área"}) As a,
                            Acts,
                            Filter(
                                Actividades As x,
                                Coalesce(x.Area, "Sin área") = a.Area,
                                IsBlank(q) || q in x.Actividad || q in x.ID || q in x.Contraparte || q in x.StatusActual || q in x.Bloqueo,
                                r = "Todos los responsables" || (r = "Sin responsable" && IsBlank(x.Responsable)) || x.Responsable = r
                            )
                        ),
                        Total, CountRows(Acts),
                        nPH, CountRows(Filter(Acts, Estado = "Por hacer")),
                        nEC, CountRows(Filter(Acts, Estado = "En curso")),
                        nER, CountRows(Filter(Acts, Estado = "En revisión")),
                        nBQ, CountRows(Filter(Acts, Estado = "Bloqueada")),
                        nTE, CountRows(Filter(Acts, Estado = "Terminada"))
                    ),
                    Total > 0
                ),
                Total,
                SortOrder.Descending
            )
        )
      X: =32
      Y: =152
      Width: =1332
      Height: =600
      TemplateSize: =196
      TemplatePadding: =0
      ShowScrollbar: =true
      Fill: =RGBA(0, 0, 0, 0)
      TemplateFill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      Visible: =Coalesce(varVista, "area") = "area"
