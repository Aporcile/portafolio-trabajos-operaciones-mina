- galLista:
    Control: Gallery@2.15.0
    Variant: VariableHeight
    Properties:
      Items: |-
        =With(
            {q: Trim(txtBuscar.Text), r: ddResp.Selected.Value},
            With(
                {base: Filter(Actividades, IsBlank(q) || q in Actividad || q in ID || q in Area || q in Contraparte || q in StatusActual || q in Bloqueo, r = "Todos los responsables" || (r = "Sin responsable" && IsBlank(Responsable)) || Responsable = r)},
                Switch(
                    varOrdenL,
                    "id", Sort(base, Right(ID, 2) & Left(ID, 4), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    "actividad", Sort(base, Actividad, If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    "area", Sort(base, Coalesce(Area, "zzz"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    "responsable", Sort(base, Coalesce(Responsable, "zzz"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    "prioridad", Sort(base, Switch(Prioridad, "Alta", 1, "Media", 2, 3), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    "estado", Sort(base, Switch(Estado, "Bloqueada", 1, "En curso", 2, "En revisión", 3, "Por hacer", 4, 5), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    "inicio", Sort(base, Coalesce(FechaInicio, "9999"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    "status", Sort(base, Coalesce(StatusActual, Bloqueo, "zzz"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                    Sort(base, Switch(Estado, "Bloqueada", 1, "En curso", 2, "En revisión", 3, "Por hacer", 4, 5) * 10 + Switch(Prioridad, "Alta", 1, "Media", 2, 3), SortOrder.Ascending)
                )
            )
        )
      X: =32
      Y: =152
      Width: =1332
      Height: =604
      TemplateSize: =50
      TemplatePadding: =0
      ShowScrollbar: =true
      Fill: =RGBA(0, 0, 0, 0)
      TemplateFill: =RGBA(0, 0, 0, 0)
      BorderThickness: =0
      Visible: =Coalesce(varVista, "area") = "lista"
      OnSelect: =Set(varAct, ThisItem); Set(varModo, "editar"); Select(btnReset); Set(varPanel, true)
      Default: |-
        =First(
            With(
                {q: Trim(txtBuscar.Text), r: ddResp.Selected.Value},
                With(
                    {base: Filter(Actividades, IsBlank(q) || q in Actividad || q in ID || q in Area || q in Contraparte || q in StatusActual || q in Bloqueo, r = "Todos los responsables" || (r = "Sin responsable" && IsBlank(Responsable)) || Responsable = r)},
                    Switch(
                        varOrdenL,
                        "id", Sort(base, Right(ID, 2) & Left(ID, 4), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        "actividad", Sort(base, Actividad, If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        "area", Sort(base, Coalesce(Area, "zzz"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        "responsable", Sort(base, Coalesce(Responsable, "zzz"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        "prioridad", Sort(base, Switch(Prioridad, "Alta", 1, "Media", 2, 3), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        "estado", Sort(base, Switch(Estado, "Bloqueada", 1, "En curso", 2, "En revisión", 3, "Por hacer", 4, 5), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        "inicio", Sort(base, Coalesce(FechaInicio, "9999"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        "status", Sort(base, Coalesce(StatusActual, Bloqueo, "zzz"), If(Coalesce(varAscL, true), SortOrder.Ascending, SortOrder.Descending)),
                        Sort(base, Switch(Estado, "Bloqueada", 1, "En curso", 2, "En revisión", 3, "Por hacer", 4, 5) * 10 + Switch(Prioridad, "Alta", 1, "Media", 2, 3), SortOrder.Ascending)
                    )
                )
            )
        )
    Children:
                      - conFilaL:
                          Control: GroupContainer@1.5.0
                          Variant: ManualLayout
                          Properties:
                            Fill: =RGBA(255, 255, 255, 1)
                            X: =0
