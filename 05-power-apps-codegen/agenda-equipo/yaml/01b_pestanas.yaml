- recTabActiva:
    Control: Rectangle@2.3.0
    Properties:
      Fill: =RGBA(79, 157, 222, 1)
      X: =Switch(Coalesce(varVista, "area"), "tablero", 32, "lista", 212, "persona", 280, "hl", 392, "revisar", 576, "historial", 688, 120)
      Y: =110
      Width: =Switch(Coalesce(varVista, "area"), "tablero", 84, "lista", 64, "persona", 108, "hl", 180, "revisar", 108, "historial", 96, 88)
      Height: =2
