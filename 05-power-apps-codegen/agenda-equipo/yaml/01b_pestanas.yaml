- tabTablero:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Tablero"
      OnSelect: =Set(varVista, "tablero")
      Font: =Font.'Segoe UI'
      Size: =10.5
      FontWeight: =FontWeight.Semibold
      Fill: =RGBA(0, 0, 0, 0)
      Color: =If(Coalesce(varVista, "area") = "tablero", RGBA(27, 42, 65, 1), RGBA(73, 80, 87, 1))
      HoverFill: =RGBA(27, 42, 65, 0.06)
      HoverColor: =If(Coalesce(varVista, "area") = "tablero", RGBA(27, 42, 65, 1), RGBA(33, 37, 41, 1))
      PressedFill: =RGBA(27, 42, 65, 0.12)
      BorderThickness: =0
      X: =32
      Y: =72
      Width: =84
      Height: =40
