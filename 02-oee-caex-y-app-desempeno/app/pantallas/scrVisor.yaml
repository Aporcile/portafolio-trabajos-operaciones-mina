                  Y: =4
            - recAgChip:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =colPrimario
                  Height: =26
                  Width: =280
                  X: =Parent.Width - 300
                  Y: =8
            - lblAgChip:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  Size: =13
                  Text: ="Semanal (" & nMinutosMeta & " min)"
                  Width: =280
                  X: =Parent.Width - 300
                  Y: =8
            - lblAgFecha:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =colPrimario
                  Fill: =colPrimarioClaro
                  Height: =22
                  Size: =11
                  Text: =Text(Today(), "dddd dd-mm", "es-ES") & " · inicio de turno"
                  Width: =280
                  X: =Parent.Width - 300
                  Y: =34
            - recAgAsistCab:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =colPrimario
                  Height: =24
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 0 * ((Parent.Width - 64) / 3 + 12)
                  Y: =62
            - lblAgAsistCab:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  Size: =13
                  Text: ="Asistentes"
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 0 * ((Parent.Width - 64) / 3 + 12)
                  Y: =62
            - lblAgAsistCuerpo:
                Control: Label@2.5.1
                Properties:
                  Color: =colTexto
                  Fill: =RGBA(240, 243, 249, 1)
                  Height: =114
                  PaddingBottom: =3
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =3
                  Size: =11
                  Text: |-
                    ="Líder · " & User().FullName & Char(10) & "Convocados · " & If(IsEmpty(Filter(colAsis, Tipo = "Convocado")), "supervisores de turno", With({n: CountRows(Filter(colAsis, Tipo = "Convocado"))}, n & If(n = 1, " supervisor", " supervisores"))) & If(IsBlank(fxPrepFila), "", Char(10) & "Preparó · " & fxPrepFila.Autor)
                  VerticalAlign: =VerticalAlign.Top
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 0 * ((Parent.Width - 64) / 3 + 12)
                  Y: =86
            - recAgDecCab:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =colPrimario
                  Height: =24
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 1 * ((Parent.Width - 64) / 3 + 12)
                  Y: =62
            - lblAgDecCab:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  Size: =13
                  Text: ="Decisiones a tomar"
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 1 * ((Parent.Width - 64) / 3 + 12)
                  Y: =62
            - lblAgDecCuerpo:
                Control: Label@2.5.1
                Properties:
                  Color: =colTexto
                  Fill: =RGBA(240, 243, 249, 1)
                  Height: =114
                  PaddingBottom: =3
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =3
                  Size: =11
                  Text: |-
                    =With(
                        {nAtr: CountRows(Filter(fxRevision, EstadoNuevo = "Atrasado"))},
                        // A 1024 px el recuadro deja ~26 caracteres por línea: quedan hasta dos puntos.
                        If(nAtr > 0, "• Acciones para " & nAtr & If(nAtr = 1, " compromiso atrasado.", " compromisos atrasados.") & Char(10), "") &
                        "• Acordar compromisos nuevos."
                    )
                  VerticalAlign: =VerticalAlign.Top
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 1 * ((Parent.Width - 64) / 3 + 12)
                  Y: =86
            - recAgIndCab:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =colPrimario
                  Height: =24
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 2 * ((Parent.Width - 64) / 3 + 12)
                  Y: =62
            - lblAgIndCab:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  Size: =13
                  Text: ="Indicadores"
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 2 * ((Parent.Width - 64) / 3 + 12)
                  Y: =62
            - lblAgIndCuerpo:
                Control: Label@2.5.1
                Properties:
                  Color: =colTexto
                  Fill: =RGBA(240, 243, 249, 1)
                  Height: =114
                  PaddingBottom: =3
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =3
                  Size: =11
                  Text: |-
                    ="• OEE de transporte (CAEX), del plan al real" & Char(10) &
                    "• Foco en las palancas bajo plan" & Char(10) &
                    "• Periodos hasta ayer; el lunes, la semana completa"
                  VerticalAlign: =VerticalAlign.Top
                  Width: =(Parent.Width - 64) / 3
                  X: =20 + 2 * ((Parent.Width - 64) / 3 + 12)
                  Y: =86
            - recAgBarra:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =colAzul
                  Height: =24
                  Width: =(Parent.Width - 40)
                  X: =20
                  Y: =204
            - lblAgBarra:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  Size: =14
                  Text: ="Agenda"
                  Width: =(Parent.Width - 40)
                  X: =20
                  Y: =204
            - lblAgHSeccion:
                Control: Label@2.5.1
                Properties:
                  Color: =colPrimario
                  Fill: =colPrimarioClaro
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  PaddingBottom: =4
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =4
                  Size: =11
                  Text: ="Sección"
                  Width: =(Parent.Width - 40) * 0.25
                  Wrap: =false
                  X: =20 + (Parent.Width - 40) * 0
                  Y: =228
            - lblAgHPuntos:
                Control: Label@2.5.1
                Properties:
                  Color: =colPrimario
                  Fill: =colPrimarioClaro
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  PaddingBottom: =4
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =4
                  Size: =11
                  Text: ="Puntos de discusión"
                  Width: =(Parent.Width - 40) * 0.61
                  Wrap: =false
                  X: =20 + (Parent.Width - 40) * 0.25
                  Y: =228
            - lblAgHTiempo:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =colPrimario
                  Fill: =colPrimarioClaro
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  Size: =11
                  Text: ="Tiempo"
                  Width: =(Parent.Width - 40) * 0.14
                  Wrap: =false
                  X: =20 + (Parent.Width - 40) * 0.86
                  Y: =228
            - galAgenda:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
                Properties:
                  Height: =Parent.Height - 314
                  Items: =tblBloques
                  TemplatePadding: =0
                  TemplateSize: =Max(44, (Parent.Height - 314) / 5)
                  Width: =(Parent.Width - 40)
                  X: =20
                  Y: =250
                Children:
                  - recAgFila:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =If(varBloque = ThisItem.N, RGBA(255, 243, 224, 1), RGBA(255, 255, 255, 1))
                        Height: =Parent.TemplateHeight
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
                  - recAgLinea:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(225, 230, 232, 1)
                        Height: =1
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =Parent.TemplateHeight - 1
                  - recAgNum:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =colPrimario
                        Height: =30
                        Width: =30
                        X: =6
                        Y: =(Parent.TemplateHeight - 30) / 2
                  - lblAgNum:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255, 255, 255, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        Size: =15
                        Text: =Text(ThisItem.N)
                        Width: =30
                        X: =6
                        Y: =(Parent.TemplateHeight - 30) / 2
                  - lblAgSeccion:
                      Control: Label@2.5.1
                      Properties:
                        Color: =colPrimario
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.TemplateHeight
                        Size: =12
                        Text: =ThisItem.Bloque
                        Width: =Parent.TemplateWidth * 0.25 - 42
                        Wrap: =false
                        X: =42
                        Y: =0
                  - lblAgPuntos:
                      Control: Label@2.5.1
                      Properties:
                        Color: =colTexto
                        Height: =Parent.TemplateHeight
                        PaddingBottom: =2
                        PaddingTop: =2
                        Size: =11
                        Text: |-
                          =Switch(
                              ThisItem.N,
                              1,
                              // Cuántos avisos hay y el más grave. La fila mide 44 px: caben 2 líneas de 11 px.
                              // El tope sale del ancho de la etiqueta (~7,2 px por carácter, en dos líneas): a 1024 px son ~100 caracteres y en
                              // pantallas más anchas casi todo el aviso.
                              With(
                                  {n: CountRows(fxAvisos), c: CountRows(Filter(fxAvisos, Nivel = "Crítico"))},
                                  If(
                                      n = 0,
                                      "Aún no hay avisos de seguridad cargados en el editor.",
                                      With(
                                          {
                                              p: n & If(n = 1, " aviso", " avisos") & If(c > 0, " (✖ " & c & If(c = 1, " crítico", " críticos") & ")", "") & ": ",
                                              t: First(Sort(fxAvisos, Rango * 1000 + Orden)).Texto,
                                              tope: Max(40, Int((Self.Width - 10) / 7.2) * 2 - 8)
                                          },
                                          p & If(Len(p) + Len(t) > tope, Left(t, Max(0, tope - 3 - Len(p))) & "…", t)
                                      )
                                  )
                              ),
                              2,
