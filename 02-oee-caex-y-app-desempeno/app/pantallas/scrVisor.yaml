                                            With(
                                                {o: If(a = "Invitados", 999, a = "Sin área", 998, i.Value) * 1000, gente: Sort(Filter(colAsis, Area = a), Nombre)},
                                                Collect(
                                                    colAsisVista,
                                                    {Orden: o, Fila: "Area", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true},
                                                    {Orden: o + 1, Fila: "AreaFin", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true}
                                                );
                                                ForAll(
                                                    Sequence(CountRows(gente)) As j,
                                                    With(
                                                        {p: Index(gente, j.Value)},
                                                        Collect(
                                                            colAsisVista,
                                                            {Orden: o + 1 + j.Value, Fila: "Persona", Area: a, IdLocal: p.IdLocal, Nombre: p.Nombre, Correo: p.Correo, Cargo: p.Cargo, Tipo: p.Tipo, Presente: p.Presente}
                                                        )
                                                    )
                                                );
                                                If(
                                                    Mod(CountRows(gente), 2) = 1,
                                                    Collect(colAsisVista, {Orden: o + 999, Fila: "Vacio", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true})
                                                )
                                            )
                                        )
                                    )
                                )
                              PaddingBottom: =6
                              PaddingLeft: =6
                              PaddingRight: =6
                              PaddingTop: =6
                              Tooltip: ="Quitar de esta reunión"
                              Visible: =ThisItem.Fila = "Persona"
                              Width: =32
                              X: =Parent.TemplateWidth - 38
                              Y: =(Parent.TemplateHeight - 32) / 2
                        - sepAsFila:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =RGBA(225, 230, 232, 1)
                              Height: =1
                              Visible: =ThisItem.Fila = "Persona"
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                  - lblAsVacio:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(90, 98, 104, 1)
                        Fill: =RGBA(244, 246, 247, 1)
                        Height: =52
                        PaddingBottom: =4
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =4
                        Size: =12
                        Text: |-
                          =If(
                              IsEmpty(Filter(colAsisQuitados, Tipo = "Convocado")),
                              "No hay lista de convocados en este equipo: se carga desde RD_Participantes con «Actualizar datos» en Inicio.",
                              "Quitaste a todos los convocados de esta reunión: «Restaurar quitados» los devuelve."
                          ) & Char(10) & "Si cierras así, la minuta llega solo a ti y a los invitados con correo."
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =IsEmpty(Filter(colAsis, Tipo = "Convocado"))
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =104
                  - lblAsInvitado:
                      Control: Label@2.5.1
                      Properties:
                        Color: =colTexto
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        Size: =13
                        Text: ="Invitado"
                        Width: =80
                        X: =24
                        Y: =Parent.Height - 140
                  - txtInvNombre:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: =""
                        Height: =44
                        HintText: ="Nombre"
                        Size: =13
                        Width: =(Parent.Width - 104 - 24 - 24 - 150) / 2
                        X: =104
                        Y: =Parent.Height - 140
                  - txtInvCorreo:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: =""
                        Height: =44
                        HintText: ="Correo (opcional)"
                        Size: =13
                        Width: =(Parent.Width - 104 - 24 - 24 - 150) / 2
                        X: =104 + (Parent.Width - 104 - 24 - 24 - 150) / 2 + 12
                        Y: =Parent.Height - 140
                  - btnAgregarInvitado:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =colPrimario
                        BorderThickness: =1
                        Color: =colPrimario
                        DisplayMode: =If(!IsBlank(Trim(txtInvNombre.Text)) && (IsBlank(Trim(txtInvCorreo.Text)) || IsMatch(Trim(txtInvCorreo.Text), Match.Email)), DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =RGBA(255, 255, 255, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =44
                        OnSelect: |-
                          =Collect(
                              colAsis,
                              {
                                  Nombre: Trim(txtInvNombre.Text),
                                  Correo: Lower(Trim(txtInvCorreo.Text)),
                                  Cargo: "",
                                  Area: "Invitados",
                                  Tipo: "Invitado",
                                  Presente: true,
                                  IdLocal: Text(GUID())
                              }
                          );
                          Reset(txtInvNombre);
                          Reset(txtInvCorreo);
                          Clear(colAsisVista);
                          With(
                              {areas: Sort(Distinct(colAsis, Area), Value)},
                              ForAll(
                                  Sequence(CountRows(areas)) As i,
                                  With(
                                      {a: Index(areas, i.Value).Value},
                                      With(
                                          {o: If(a = "Invitados", 999, a = "Sin área", 998, i.Value) * 1000, gente: Sort(Filter(colAsis, Area = a), Nombre)},
                                          Collect(
                                              colAsisVista,
                                              {Orden: o, Fila: "Area", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true},
                                              {Orden: o + 1, Fila: "AreaFin", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true}
                                          );
                                          ForAll(
                                              Sequence(CountRows(gente)) As j,
                                              With(
                                                  {p: Index(gente, j.Value)},
                                                  Collect(
                                                      colAsisVista,
                                                      {Orden: o + 1 + j.Value, Fila: "Persona", Area: a, IdLocal: p.IdLocal, Nombre: p.Nombre, Correo: p.Correo, Cargo: p.Cargo, Tipo: p.Tipo, Presente: p.Presente}
                                                  )
                                              )
                                          );
                                          If(
                                              Mod(CountRows(gente), 2) = 1,
                                              Collect(colAsisVista, {Orden: o + 999, Fila: "Vacio", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true})
                                          )
                                      )
                                  )
                              )
                          )
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =13
                        Text: ="+ Agregar"
                        Width: =150
                        X: =Parent.Width - 24 - 150
                        Y: =Parent.Height - 140
                  - sepAsPie:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =RGBA(225, 230, 232, 1)
                        Height: =1
                        Width: =Parent.Width
                        X: =0
                        Y: =Parent.Height - 84
                  - lblAsConteo:
                      Control: Label@2.5.1
                      Properties:
                        Color: =colTexto
                        Height: =60
                        PaddingBottom: =2
                        PaddingTop: =2
                        Size: =12
                        Text: |-
                          ="Presentes: " & CountRows(Filter(colAsis, Tipo = "Convocado" && Presente)) & " de " & CountRows(Filter(colAsis, Tipo = "Convocado")) &
                          If(IsEmpty(Filter(colAsis, Tipo = "Invitado")), "", " · invitados: " & CountRows(Filter(colAsis, Tipo = "Invitado"))) & Char(10) &
                          With({n: CountRows(Distinct(Filter(colAsis, !IsBlank(Correo)), Lower(Correo))) + If(IsBlank(LookUp(colAsis, Lower(Correo) = Lower(User().Email))), 1, 0)}, "La minuta va a " & n & If(n = 1, " correo", " correos"))
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 24 - 24 - 470 - 12
                        X: =24
                        Y: =Parent.Height - 74
                  - btnAsVolver:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(160, 160, 160, 1)
                        BorderThickness: =1
                        Color: =colTexto
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =52
                        OnSelect: =Set(varVerAsistencia, false)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =14
                        Text: ="Volver a la reunión"
                        Width: =198
                        X: =Parent.Width - 24 - 260 - 12 - 198
                        Y: =Parent.Height - 70
                  - btnAsCerrar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        Fill: =colAmbar
                        FontWeight: =FontWeight.Bold
                        Height: =52
                        OnSelect: |-
                          =If(
                              IsBlank(varEditNuevo) && !IsBlank(Trim(txtNuevoQue.Text)) && !IsBlank(Trim(txtNuevoResp.Text)),
                              Collect(colNuevos, {Titulo: Trim(txtNuevoQue.Text), Responsable: Trim(txtNuevoResp.Text), FechaLimite: dpNuevoFecha.SelectedDate, IdLocal: Text(GUID())})
                          );
                          Set(varFin, Now());
                          Collect(colTiempos, {Bloque: varBloque, Seg: DateDiff(varBloqueInicio, varFin, TimeUnit.Seconds)});
                          // Copia de lo preparado: al registrar la sesión cambia la fecha de la próxima reunión y las fórmulas se recalculan.
                          ClearCollect(colCierreRev, fxRevision);
                          // colCierreDest queda vacía, con la forma de fxDest, para que Inicio siga sincronizando igual y no se escriban destacados
                          // de una preparación anterior.
                          ClearCollect(colCierreDest, FirstN(fxDest, 0));
                          Set(varCierreSeg, fxSeg);
                          ClearCollect(colCierreAvisos, fxAvisos);
                          Set(varCierreInd, fxIndSeg);
                          // Los registros salen con las mismas columnas que los Excel de RD/Datos.
                          // Fechas como texto aaaa-mm-dd (y hh:mm) para que no se corran por zona horaria.
                          Collect(
                              colOutSesiones,
                              {
                                  Titulo: "RD-" & gblGrupo & "-" & Text(Today(), "yyyy-mm-dd"),
                                  Grupo: gblGrupo,
                                  Area: "Operaciones Mina",
                                  Fecha: Text(Today(), "yyyy-mm-dd"),
                                  HoraInicio: Text(varInicio, "yyyy-mm-dd hh:mm"),
                                  HoraTermino: Text(varFin, "yyyy-mm-dd hh:mm"),
                                  Estado: "Cerrada",
                                  Motivo: "",
                                  LiderNombre: User().FullName,
                                  LiderEmail: User().Email,
                                  Asistentes: CountRows(Filter(colAsis, Presente)),
                                  Animo1: 0,
                                  Animo2: 0,
                                  Animo3: 0,
                                  Animo4: 0,
                                  Animo5: 0,
                                  TemaSeguridad: varCierreSeg,
                                  MinutosDuracion: Round(DateDiff(varInicio, varFin, TimeUnit.Seconds) / 60, 1),
                                  // Minutos sobre la duración planificada (nMinutosMeta).
                                  MinutosExceso: Max(0, Round(DateDiff(varInicio, varFin, TimeUnit.Seconds) / 60 - nMinutosMeta, 1)),
                                  TiemposBloques: JSON(colTiempos),
                                  IdeasPresentadas: 0,
                                  CompromisosNuevos: CountRows(colNuevos) + CountRows(colNuevosPrep),
                                  Observaciones: "",
                                  RutaActa: "",
                                  IdLocal: gblSesionId
                              }
                          );
                          ForAll(
                              colCierreRev As r,
                              Collect(
                                  colOutRevisiones,
                                  {
                                      Clave: "REV-" & gblSesionId & "-" & r.ID,
                                      FechaRevision: Text(varFin, "yyyy-mm-dd hh:mm"),
                                      CompromisoId: r.ID,
                                      Compromiso: r.Titulo,
                                      EstadoAnterior: r.EstadoAnterior,
                                      EstadoNuevo: r.EstadoNuevo,
                                      Comentario: r.Comentario,
                                      Grupo: gblGrupo,
                                      SesionIdLocal: gblSesionId
                                  }
                              )
                          );
                          // Evidencias (fotos o archivos) que no alcanzaron a subirse al preparar (solo en el equipo que las tomó): suben al sincronizar.
                          ForAll(
                              colEvid As e,
                              If(
                                  IsBlank(LookUp(colCierreRev, ID = e.CompromisoId).Url),
                                  Collect(
                                      colOutEvidencias,
                                      {
                                          IdLocal: Text(GUID()),
                                          SesionIdLocal: gblSesionId,
                                          CompromisoId: e.CompromisoId,
                                          Grupo: gblGrupo,
                                          Comentario: LookUp(colCierreRev, ID = e.CompromisoId).Comentario,
                                          Foto: e.Foto,
                                          Url: "",
                                          NombreArchivo: gblGrupo & "_" & Text(Today(), "yyyy-mm-dd") & "_C" & e.CompromisoId & "_" & Left(gblSesionId, 8) &
                                              If(IsBlank(e.Nombre), ".jpg", IsBlank(Find(".", e.Nombre)), "", "." & Lower(Last(Split(e.Nombre, ".")).Value))
                                      }
                                  )
                              )
                          );
                          // Evidencias ya subidas al preparar: solo falta dejar su link en el compromiso.
                          ForAll(
                              Filter(colCierreRev, !IsBlank(Url)) As r,
                              Collect(
                                  colOutEvidencias,
                                  {
                                      IdLocal: Text(GUID()),
                                      SesionIdLocal: gblSesionId,
                                      CompromisoId: r.ID,
                                      Grupo: gblGrupo,
                                      Comentario: r.Comentario,
                                      Foto: If(false, First(colEvid).Foto),
                                      Url: r.Url,
                                      NombreArchivo: ""
                                  }
                              )
                          );
                          ForAll(
                              colNuevos As n,
                              If(
                                  IsBlank(LookUp(colOutCompromisos, IdLocal = n.IdLocal)),
                                  Collect(
                                      colOutCompromisos,
                                      {
                                          // ID se numera al sincronizar (Excel no tiene autonumérico).
                                          ID: 0,
                                          Titulo: n.Titulo,
                                          ResponsableNombre: n.Responsable,
                                          FechaLimite: Text(n.FechaLimite, "yyyy-mm-dd"),
                                          Estado: "Abierto",
                                          Abierto: "Sí",
                                          FechaCreacion: Text(Today(), "yyyy-mm-dd"),
                                          FechaCierre: "",
                                          Comentario: "",
                                          EvidenciaUrl: "",
                                          Grupo: gblGrupo,
                                          Prioridad: "Media",
                                          Origen: "Reunión",
                                          ResponsableEmail: "",
                                          SesionIdLocal: gblSesionId,
                                          IdLocal: n.IdLocal
                                      }
                                  )
                              )
                          );
                          // Compromisos de esta semana preparados en el editor: se vieron en Compromisos y se suben En progreso.
                          ForAll(
                              colNuevosPrep As n,
                              If(
                                  IsBlank(LookUp(colOutCompromisos, IdLocal = n.IdLocal)),
                                  Collect(
                                      colOutCompromisos,
                                      {
                                          ID: 0,
                                          Titulo: n.Titulo,
                                          ResponsableNombre: n.Responsable,
                                          FechaLimite: Text(n.FechaLimite, "yyyy-mm-dd"),
                                          Estado: "En progreso",
                                          Abierto: "Sí",
                                          FechaCreacion: Text(Today(), "yyyy-mm-dd"),
                                          FechaCierre: "",
                                          Comentario: "",
                                          EvidenciaUrl: "",
                                          Grupo: gblGrupo,
                                          Prioridad: "Media",
                                          Origen: "Reunión",
                                          ResponsableEmail: "",
                                          SesionIdLocal: gblSesionId,
                                          IdLocal: n.IdLocal
                                      }
                                  )
                              )
                          );
                          ForAll(
                              colCierreDest As d,
                              Collect(
                                  colOutDestacados,
                                  {
                                      FechaReunion: Text(Today(), "yyyy-mm-dd"),
                                      Tipo: d.Tipo,
                                      Orden: d.Orden,
                                      Texto: d.Texto,
                                      Grupo: gblGrupo,
                                      SesionIdLocal: gblSesionId,
                                      IdLocal: d.IdLocal
                                  }
                              )
                          );
                          // Asistencia y minuta: una fila de asistencia por reunión y la minuta en la bandeja de salida.
                          Collect(
                              colOutAsistencia,
                              {
                                  Fecha: Text(Today(), "yyyy-mm-dd"),
                                  SesionIdLocal: gblSesionId,
                                  Convocados: CountRows(Filter(colAsis, Tipo = "Convocado")),
                                  Presentes: CountRows(Filter(colAsis, Tipo = "Convocado" && Presente)),
                                  Invitados: CountRows(Filter(colAsis, Tipo = "Invitado")),
                                  Ausentes: Concat(Filter(colAsis, !Presente), Nombre, ", "),
                                  Json: JSON(ForAll(colAsis As a, {Nombre: a.Nombre, Correo: a.Correo, Area: a.Area, Tipo: a.Tipo, Presente: a.Presente})),
                                  LiderEmail: User().Email
                              }
                          );
                          Set(
                              varMinutaCab,
                              "<div style='background:#1b2a41;color:#ffffff;padding:16px 20px'>" &
                              "<div style='font-size:20px;font-weight:bold'>Minuta · Reunión semanal de supervisores</div>" &
                              "<div style='font-size:13px;color:#c8d3e3;margin-top:4px'>RD Minera Demo · " & Text(varInicio, "dddd dd-mm-yyyy", "es-ES") &
                              " · " & Text(varInicio, "hh:mm") & " a " & Text(varFin, "hh:mm") & " · " &
                              Round(DateDiff(varInicio, varFin, TimeUnit.Seconds) / 60, 0) & " de " & nMinutosMeta & " min</div></div>"
                          );
                          Set(
                              varMinutaCuerpo,
                              "<div style='padding:4px 20px 16px'>" &
                              // Asistencia
                              "<h3 style='font-size:15px;color:#1b2a41;border-bottom:2px solid #4f9dde;padding-bottom:4px;margin:24px 0 8px'>Asistencia</h3>" &
                              "<p style='margin:4px 0'><b>Líder:</b> " & Substitute(Substitute(Substitute(User().FullName, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</p>" &
                              "<p style='margin:4px 0'><b>Presentes (" & CountRows(Filter(colAsis, Tipo = "Convocado" && Presente)) & " de " &
                              CountRows(Filter(colAsis, Tipo = "Convocado")) & " convocados):</b> " &
                              If(
                                  IsEmpty(Filter(colAsis, Tipo = "Convocado" && Presente)),
                                  "ninguno",
                                  Concat(Sort(Filter(colAsis, Tipo = "Convocado" && Presente), Nombre), Substitute(Substitute(Substitute(Nombre, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), ", ")
                              ) & "</p>" &
                              If(
                                  IsEmpty(Filter(colAsis, !Presente)),
                                  "",
                                  "<p style='margin:4px 0'><b>Ausentes:</b> " & Concat(Sort(Filter(colAsis, !Presente), Nombre), Substitute(Substitute(Substitute(Nombre, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), ", ") & "</p>"
                              ) &
                              If(
                                  IsEmpty(Filter(colAsis, Tipo = "Invitado")),
                                  "",
                                  "<p style='margin:4px 0'><b>Invitados:</b> " & Concat(Sort(Filter(colAsis, Tipo = "Invitado"), Nombre), Substitute(Substitute(Substitute(Nombre, "&", "&amp;"), "<", "&lt;"), ">", "&gt;"), ", ") & "</p>"
                              ) &
                              // 1. Seguridad
                              "<h3 style='font-size:15px;color:#1b2a41;border-bottom:2px solid #4f9dde;padding-bottom:4px;margin:24px 0 8px'>1. Seguridad</h3>" &
                              With(
                                  {d: varCierreInd},
                                  If(
                                      IsBlank(d.Inc) && IsBlank(d.Rep) && IsBlank(d.InsReal),
                                      "",
                                      "<p style='margin:4px 0'><b>Incidentes de la semana:</b> " & Coalesce(Text(d.Inc), "—") & If(IsBlank(d.IncAnt), "", " (anterior: " & d.IncAnt & ")") &
                                      " · <b>Hipo Hazard:</b> " & Coalesce(Text(d.Rep), "—") & If(IsBlank(d.RepMeta), "", " (meta " & d.RepMeta & ")") &
                                      " · <b>Inspecciones:</b> " & Coalesce(Text(d.InsReal), "—") & If(IsBlank(d.InsPlan), "", " de " & d.InsPlan) & "</p>"
                                  )
                              ) &
                              If(
                                  IsEmpty(colCierreAvisos),
                                  "<p style='margin:4px 0;color:#828a8e'>Sin avisos registrados.</p>",
                                  "<table cellpadding='0' cellspacing='0' style='border-collapse:collapse;width:100%;font-size:13px'>" &
                                  Concat(
                                      Sort(colCierreAvisos, Rango * 1000 + Orden),
                                      "<tr><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top;white-space:nowrap;width:120px'><span style='color:#ffffff;padding:2px 8px;border-radius:10px;background:" &
                                      Switch(Nivel, "Crítico", "#c62828", "Precaución", "#ed6c02", "Recordar", "#2e7d32", "#1b2a41") & "'>" &
                                      Switch(Nivel, "Crítico", "✖ Crítico", "Precaución", "⚠ Precaución", "Recordar", "✔ Recordar", "Aviso") &
                                      "</span></td><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top'>" & Substitute(Substitute(Substitute(Texto, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td></tr>"
                                  ) & "</table>"
                              ) &
                              // 2. Compromisos: los de la semana pasada y, al final, los de esta semana preparados en el editor (En progreso)
                              "<h3 style='font-size:15px;color:#1b2a41;border-bottom:2px solid #4f9dde;padding-bottom:4px;margin:24px 0 8px'>2. Compromisos</h3>" &
                              If(
                                  IsEmpty(colCierreRev) && IsEmpty(colNuevosPrep),
                                  "<p style='margin:4px 0;color:#828a8e'>No había compromisos abiertos.</p>",
                                  "<p style='margin:4px 0'>" & With({n: CountRows(colCierreRev)}, n & If(n = 1, " revisado", " revisados")) & " · " &
                                  With({n: CountRows(Filter(colCierreRev, EstadoNuevo = "Cumplido"))}, n & If(n = 1, " cumplido", " cumplidos")) & " · " &
                                  With({n: CountRows(Filter(colCierreRev, EstadoNuevo = "Atrasado"))}, n & If(n = 1, " atrasado", " atrasados")) &
                                  If(IsEmpty(colNuevosPrep), "", " · " & With({n: CountRows(colNuevosPrep)}, n & If(n = 1, " nuevo de esta semana", " nuevos de esta semana"))) & "</p>" &
                                  "<table cellpadding='0' cellspacing='0' style='border-collapse:collapse;width:100%;font-size:13px'><tr><th align='left' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Compromiso</th><th align='left' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Responsable</th><th align='center' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Vence</th><th align='center' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Estado</th></tr>" &
                                  Concat(
                                      Sort(colCierreRev, FechaLimite),
                                      "<tr><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top'>" & Substitute(Substitute(Substitute(Titulo, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") &
                                      If(IsBlank(Comentario), "", "<br><span style='font-size:12px;color:#2e7d32'>Evidencia: " & Substitute(Substitute(Substitute(Comentario, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</span>") &
                                      If(IsBlank(Url), "", " <a href='" & Url & "' style='font-size:12px'>ver evidencia</a>") &
                                      "</td><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top'>" & Substitute(Substitute(Substitute(ResponsableNombre, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td><td align='center' style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top;white-space:nowrap'>" & Text(FechaLimite, "dd-mm") & "</td><td align='center' style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top;white-space:nowrap'>" &
                                      "<span style='color:#ffffff;padding:2px 8px;border-radius:10px;background:" &
                                      Switch(EstadoNuevo, "Cumplido", "#2e7d32", "Atrasado", "#ed6c02", "#1b2a41") & "'>" &
                                      Switch(EstadoNuevo, "Cumplido", "✔ Cumplido", "Atrasado", "⚠ Atrasado", "En progreso") &
                                      "</span></td></tr>"
                                  ) &
                                  Concat(
                                      Sort(colNuevosPrep, FechaLimite),
                                      "<tr><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top'>" & Substitute(Substitute(Substitute(Titulo, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top'>" & Substitute(Substitute(Substitute(Responsable, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td><td align='center' style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top;white-space:nowrap'>" & Text(FechaLimite, "dd-mm") &
                                      "</td><td align='center' style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top;white-space:nowrap'><span style='color:#ffffff;padding:2px 8px;border-radius:10px;background:#1b2a41'>En progreso</span></td></tr>"
                                  ) & "</table>"
                              ) &
                              // 3. Indicadores: OEE de transporte (CAEX) en JUE-DOM, SEMANAL y MENSUAL, con el detalle solo de lo bajo plan
                              "<h3 style='font-size:15px;color:#1b2a41;border-bottom:2px solid #4f9dde;padding-bottom:4px;margin:24px 0 8px'>3. Indicadores · OEE de transporte (CAEX)</h3>" &
                              If(
                                  IsEmpty(colOEE),
                                  "<p style='margin:4px 0;color:#828a8e'>Sin datos del informe OEE cargados.</p>",
                                  "<p style='margin:4px 0 6px;font-size:12px;color:#5a6268'>Movimiento de los CAEX contra el plan y, en cada periodo, solo las " &
                                  "palancas que quedaron bajo el plan, de la que más perdió a la que menos. " & First(colOEE).Datos & ".</p>" &
                                  "<table cellpadding='0' cellspacing='0' style='border-collapse:collapse;width:100%;font-size:13px'><tr><th align='left' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Palanca</th><th align='right' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Real</th><th align='right' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Plan</th><th align='right' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Toneladas</th></tr>" &
                                  Concat(
                                      Sort(colOEE, Orden) As p,
                                      "<tr><td colspan='4' style='background:#1b2a41;color:#ffffff;padding:6px 8px;font-weight:bold'>" & p.Periodo & "<span style='font-weight:normal;color:#c8d3e3'> · " &
                                      Text(p.Ini, "ddd dd-mm", "es-ES") & If(p.Fin = p.Ini, "", " a " & Text(p.Fin, "ddd dd-mm", "es-ES")) & "</span></td></tr>" &
                                      If(
                                          IsBlank(p.PlanT) || p.PlanT = 0,
                                          "<tr><td colspan='4' style='padding:5px 8px;border-bottom:1px solid #e1e6e8;color:#828a8e'>Movimiento " & Text(p.RealT, "#,##0") & " t · sin plan cargado para este periodo.</td></tr>",
                                          With(
                                              {v: p.RealT / p.PlanT - 1},
                                              "<tr><td colspan='4' style='padding:5px 8px;border-bottom:1px solid #e1e6e8;background:#f0f3f9'>Movimiento <b>" & Text(p.RealT, "#,##0") & " t</b> de " & Text(p.PlanT, "#,##0") &
                                              " t del plan (<b style='color:" & If(v * 1000 < -1, "#c62828", "#1b2a41") & "'>" & If(v > 0, "+", "") &
                                              Text(v * 100, "0.00") & "%</b>) · OEE " & Text(p.OEEReal * 100, "0.0") & "% (plan " & Text(p.OEEPlan * 100, "0.0") &
                                              "%)</td></tr>"
                                          ) &
                                          With(
                                              {
                                                  bajo: Sort(
                                                      Filter(
                                                          Table(
                                                              {Palanca: "Disponibilidad", Real: Text(p.DFReal * 100, "0.0") & "%", Plan: Text(p.DFPlan * 100, "0.0") & "%", T: p.PerdDF},
                                                              {Palanca: "UEBD", Real: Text(p.UEBDReal * 100, "0.0") & "%", Plan: Text(p.UEBDPlan * 100, "0.0") & "%", T: p.PerdUEBD},
                                                              {Palanca: "Rendimiento efectivo", Real: Text(p.RendReal, "#,##0") & " t/h", Plan: Text(p.RendPlan, "#,##0") & " t/h", T: p.PerdRend},
                                                              {Palanca: "Horas nominales", Real: Text(p.HNReal, "#,##0") & " h", Plan: Text(p.HNPlan, "#,##0") & " h", T: p.PerdHN}
                                                          ),
                                                          !IsBlank(T) && T < -p.PlanT / 1000
                                                      ),
                                                      T
                                                  )
                                              },
                                              If(
                                                  IsEmpty(bajo),
                                                  "<tr><td colspan='4' style='padding:5px 8px;border-bottom:1px solid #e1e6e8;color:#2e7d32'>✔ Ninguna palanca quedó bajo el plan.</td></tr>",
                                                  Concat(
                                                      bajo,
                                                      "<tr><td style='padding:5px 8px;border-bottom:1px solid #e1e6e8'>" & Palanca & "</td><td align='right' style='padding:5px 8px;border-bottom:1px solid #e1e6e8;white-space:nowrap'><b>" & Real & "</b></td><td align='right' style='padding:5px 8px;border-bottom:1px solid #e1e6e8;white-space:nowrap'><span style='color:#5a6268'>" & Plan &
                                                      "</span></td><td align='right' style='padding:5px 8px;border-bottom:1px solid #e1e6e8;white-space:nowrap'><b style='color:#c62828'>" & Text(T, "#,##0") & " t</b></td></tr>"
                                                  )
                                              )
                                          )
                                      )
                                  ) & "</table>"
                              ) &
                              // 4. Compromisos nuevos que surgieron en la reunión (los preparados en el editor van en la sección 2)
                              "<h3 style='font-size:15px;color:#1b2a41;border-bottom:2px solid #4f9dde;padding-bottom:4px;margin:24px 0 8px'>4. Compromisos nuevos</h3>" &
                              If(
                                  IsEmpty(colNuevos),
                                  "<p style='margin:4px 0;color:#828a8e'>No se registraron compromisos nuevos.</p>",
                                  "<table cellpadding='0' cellspacing='0' style='border-collapse:collapse;width:100%;font-size:13px'><tr><th align='left' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Compromiso</th><th align='left' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Responsable</th><th align='center' style='background:#dfe5ee;color:#1b2a41;padding:6px 8px'>Fecha límite</th></tr>" &
                                  Concat(
                                      Sort(colNuevos, FechaLimite),
                                      "<tr><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top'>" & Substitute(Substitute(Substitute(Titulo, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td><td style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top'>" & Substitute(Substitute(Substitute(Responsable, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "</td><td align='center' style='padding:6px 8px;border-bottom:1px solid #e1e6e8;vertical-align:top;white-space:nowrap'>" & Text(FechaLimite, "dd-mm-yyyy") & "</td></tr>"
                                  ) & "</table>"
                              ) &
                              "<p style='margin:24px 0 0;font-size:11px;color:#828a8e'>Minuta generada por la app RD Terreno (prototipo) al cerrar la reunión. " &
                              "Se envía a todos los convocados, hayan asistido o no.</p></div>"
                          );
                          // Destinatarios: presentes (con quien cierra, aunque no esté en la lista) y, en otro correo, los ausentes.
                          ClearCollect(colMinPara, ForAll(Filter(colAsis, Presente && !IsBlank(Correo)) As a, {Correo: Lower(a.Correo)}));
                          If(IsBlank(LookUp(colAsis, Lower(Correo) = Lower(User().Email))), Collect(colMinPara, {Correo: Lower(User().Email)}));
                          ClearCollect(colMinParaAus, ForAll(Filter(colAsis, !Presente && !IsBlank(Correo)) As a, {Correo: Lower(a.Correo)}));
                          Collect(
                              colOutMinuta,
                              {
                                  Id: Text(GUID()),
                                  SesionIdLocal: gblSesionId,
                                  Para: Concat(Distinct(colMinPara, Correo), Value, ";"),
                                  Asunto: "Minuta RD Minera Demo · " & Text(Today(), "dd-mm-yyyy"),
                                  Html: "<div style='font-family:Segoe UI,Arial,sans-serif;color:#212529;max-width:760px'>" & varMinutaCab & varMinutaCuerpo & "</div>"
                              }
                          );
                          If(
                              !IsEmpty(colMinParaAus),
                              Collect(
                                  colOutMinuta,
                                  {
                                      Id: Text(GUID()),
                                      SesionIdLocal: gblSesionId,
                                      Para: Concat(Distinct(colMinParaAus, Correo), Value, ";"),
                                      Asunto: "Minuta RD Minera Demo · " & Text(Today(), "dd-mm-yyyy"),
                                      Html: "<div style='font-family:Segoe UI,Arial,sans-serif;color:#212529;max-width:760px'>" & varMinutaCab & "<div style='background:#fff3e0;border-left:4px solid #f28c28;padding:10px 14px;margin:14px 20px 0;font-size:13px'>No asististe a esta reunión. Este es el resumen de lo que se vio.</div>" & varMinutaCuerpo & "</div>"
                                  }
                              )
                          );
                          SaveData(colOutAsistencia, "rd_out_asis");
                          SaveData(colOutMinuta, "rd_out_min");
                          SaveData(colOutSesiones, "rd_out_ses");
                          SaveData(colOutRevisiones, "rd_out_rev");
                          SaveData(colOutCompromisos, "rd_out_comp");
                          SaveData(colOutEvidencias, "rd_out_evid");
                          SaveData(colOutDestacados, "rd_out_dest");
                          // Cumplido cierra el compromiso (queda en Excel, no vuelve a aparecer); En progreso y Atrasado siguen abiertos.
                          RemoveIf(colCompromisos, ID in Filter(colCierreRev, EstadoNuevo = "Cumplido").ID);
                          ForAll(Filter(colCierreRev, EstadoNuevo <> EstadoAnterior) As r, UpdateIf(colCompromisos, ID = r.ID, {Estado: r.EstadoNuevo}));
                          SaveData(colCompromisos, "rd_comp");
                          Clear(colNuevos);
                          Clear(colNuevosPrep);
                          Clear(colEvid);
                          Clear(colCierreRev);
                          Clear(colCierreDest);
                          Clear(colAsis);
                          Clear(colAsisQuitados);
                          Clear(colAsisVista);
                          Set(varVerAsistencia, false);
                          Set(varPrepSucia, false);
                          Set(varReunionEnCurso, false);
                          Notify("Reunión cerrada en " & Round(DateDiff(varInicio, varFin, TimeUnit.Seconds) / 60, 1) & " min. Se sube sola cuando haya señal.", NotificationType.Success);
                          Navigate(scrInicio, ScreenTransition.Fade)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =15
                        Text: ="Cerrar y enviar minuta"
                        Width: =260
                        X: =Parent.Width - 24 - 260
                        Y: =Parent.Height - 70
