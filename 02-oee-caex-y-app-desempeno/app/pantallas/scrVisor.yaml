Screens:
  scrVisor:
    Properties:
      Fill: =colFondo
      OnVisible: |-
        =If(
            !varReunionEnCurso,
            Set(varReunionEnCurso, true);
            Set(gblSesionId, Text(GUID()));
            Set(varInicio, Now());
            Set(varAhora, Now());
            Set(varBloque, 0);
            Set(varFiltroEstado, "");
            Set(varBloqueInicio, Now());
            Clear(colTiempos);
            // Compromisos de esta semana preparados en el editor: salen en Compromisos con estado En progreso.
            // El Cierre (colNuevos) parte vacío: es para los que surgen en la reunión.
            ClearCollect(
                colNuevosPrep,
                ForAll(
                    If(IsBlank(fxPrep.nue), Table(ParseJSON("[]")), Table(fxPrep.nue)) As n,
                    {
                        Titulo: Text(n.Value.t),
                        Responsable: Text(n.Value.r),
                        FechaLimite: DateValue(Text(n.Value.f)),
                        IdLocal: Text(n.Value.id)
                    }
                )
            );
            Clear(colNuevos);
            // Asistencia: parte con todos los convocados presentes (lista de RD_Participantes).
            ClearCollect(
                colAsis,
                ForAll(
                    colParticipantes As p,
                    {Nombre: p.Nombre, Correo: p.Correo, Cargo: p.Cargo, Area: If(IsBlank(p.Area), "Sin área", p.Area), Tipo: "Convocado", Presente: true, IdLocal: Text(GUID())}
                )
            );
            Clear(colAsisQuitados)
        );
        // Si la reunión empezó antes de que llegara la preparación, se vuelven a tomar los compromisos preparados.
        If(IsEmpty(colNuevosPrep) && IsEmpty(colNuevos), ClearCollect(
                colNuevosPrep,
                ForAll(
                    If(IsBlank(fxPrep.nue), Table(ParseJSON("[]")), Table(fxPrep.nue)) As n,
                    {
                        Titulo: Text(n.Value.t),
                        Responsable: Text(n.Value.r),
                        FechaLimite: DateValue(Text(n.Value.f)),
                        IdLocal: Text(n.Value.id)
                    }
                )
            ));
        Set(varVerAsistencia, false);
        Set(varEvidVerId, 0);
        Set(varConfSalir, false);
        Set(varEditNuevo, Blank());
        Set(varBorrarNuevo, Blank())
    Children:
      - conHeaderReunion:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =colPrimario
            Height: =72
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - imgLogoReunion:
                Control: Image@2.2.3
                Properties:
                  Height: =56
                  Image: ='logo_minera_demo_blanco'
                  ImagePosition: =ImagePosition.Fit
                  Width: =120
                  X: =12
                  Y: =8
            - imgLogoAreaReunion:
                Control: Image@2.2.3
                Properties:
                  Height: =44
                  Image: ="data:image/png;base64,"
                  ImagePosition: =ImagePosition.Fit
                  Width: =44
                  X: =138
                  Y: =14
            - lblTituloReunion:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =44
                  Size: =If(Self.Width >= 300, 15, Self.Width >= 226, 13, 12)
                  Text: ="RD Minera Demo · " & Text(Today(), If(Self.Width >= 260, "ddd dd-mm", "dd-mm"), "es-ES")
                  Width: =btnCronoTotal.X - 198
                  Wrap: =false
                  X: =190
                  Y: =6
            - lblPrepInfo:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(200, 211, 227, 1)
                  Height: =20
                  Size: =11
                  Text: |-
                    =With({f: fxPrepFila}, If(IsBlank(f), "Sin preparación guardada", "Preparación guardada " & IfError(Text(DateTimeValue(f.Actualizado), "dd-mm hh:mm"), f.Actualizado)))
                  Width: =242
                  Wrap: =false
                  X: =190
                  Y: =46
            - btnCronoTotal:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: =If(DateDiff(varInicio, varAhora, TimeUnit.Seconds) > nMinutosMeta * 60, colRojo, RGBA(255, 255, 255, 0.14))
                  FontWeight: =FontWeight.Bold
                  Height: =46
                  OnSelect: =false
                  RadiusBottomLeft: =23
                  RadiusBottomRight: =23
                  RadiusTopLeft: =23
                  RadiusTopRight: =23
                  Size: =If(Len(Self.Text) > 13, 14, 18)
                  Text: |-
                    =With(
                        {s: DateDiff(varInicio, varAhora, TimeUnit.Seconds), m: nMinutosMeta * 60},
                        RoundDown(s / 60, 0) & ":" & Text(Mod(s, 60), "00") & " / " & nMinutosMeta & ":00" &
                        If(s > m, " +" & RoundDown((s - m) / 60, 0) & ":" & Text(Mod(s - m, 60), "00"), "")
                    )
                  Width: =190
                  X: =Min(Max((Parent.Width - 190) / 2, 460), Parent.Width - 592)
                  Y: =13
            - btnCronoBloque:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: =If(varBloque > 0 && DateDiff(varBloqueInicio, varAhora, TimeUnit.Seconds) > LookUp(tblBloques, N = varBloque).Min * 60, colRojo, RGBA(255, 255, 255, 0.14))
                  FontWeight: =FontWeight.Semibold
                  Height: =46
                  OnSelect: =false
                  RadiusBottomLeft: =23
                  RadiusBottomRight: =23
                  RadiusTopLeft: =23
                  RadiusTopRight: =23
                  Size: =12
                  Text: |-
                    =If(
                        varBloque = 0,
                        "Agenda de la reunión",
                        With(
                            {r: LookUp(tblBloques, N = varBloque).Min * 60 - DateDiff(varBloqueInicio, varAhora, TimeUnit.Seconds)},
                            LookUp(tblBloques, N = varBloque).Bloque & ": " &
                            If(r >= 0, "quedan " & RoundDown(r / 60, 0) & ":" & Text(Mod(r, 60), "00"), "excedido " & RoundDown(-r / 60, 0) & ":" & Text(Mod(-r, 60), "00"))
                        )
                    )
                  Width: =224
                  X: =Parent.Width - 394
                  Y: =13
            - btnCerrarReunion:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  Fill: =colAmbar
                  FontWeight: =FontWeight.Bold
                  Height: =48
                  OnSelect: |-
                    =Clear(colAsisVista);
                    With(
                        {areas: Sort(Distinct(colAsis, Area), Value)},
                        ForAll(
                            Sequence(CountRows(areas)) As i,
                            With(
                                {a: Index(areas, i.Value).Value},
                                With(
                                    {o: If(a = "Invitados", 999, a = "Sin área", 998, i.Value) * 1000, gente: Sort(Filter(colAsis, Area = a), Nombre)},
                                    Collect(
                                        colAsisVista,
                                        {Orden: o, Fila: "Area", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true},
                                        {Orden: o + 1, Fila: "AreaFin", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true}
                                    );
                                    ForAll(
                                        Sequence(CountRows(gente)) As j,
                                        With(
                                            {p: Index(gente, j.Value)},
                                            Collect(
                                                colAsisVista,
                                                {Orden: o + 1 + j.Value, Fila: "Persona", Area: a, IdLocal: p.IdLocal, Nombre: p.Nombre, Correo: p.Correo, Cargo: p.Cargo, Tipo: p.Tipo, Presente: p.Presente}
                                            )
                                        )
                                    );
                                    If(
                                        Mod(CountRows(gente), 2) = 1,
                                        Collect(colAsisVista, {Orden: o + 999, Fila: "Vacio", Area: a, IdLocal: "", Nombre: "", Correo: "", Cargo: "", Tipo: "", Presente: true})
                                    )
                                )
                            )
                        )
                    );
                    Set(varVerAsistencia, true)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =14
                  Text: ="Finalizar"
                  Width: =150
                  X: =Parent.Width - 162
                  Y: =12
      - tmrReunion:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =1000
            OnTimerEnd: =Set(varAhora, Now())
            Repeat: =true
            Visible: =false
      - galBloques:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_ThreeTextVariant_ver5.0
          Properties:
            Height: =CountRows(tblPaginasVisor) * 64 + 6
            Items: =tblPaginasVisor
            ShowScrollbar: =false
            TemplatePadding: =6
            TemplateSize: =58
            Width: =266
            X: =10
            Y: =88
          Children:
            - btnBloque:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =colPrimario
                  BorderThickness: =1
                  Color: =If(varBloque = ThisItem.N, RGBA(255, 255, 255, 1), colPrimario)
                  Fill: |-
                    =If(
                        varBloque = ThisItem.N,
                        colPrimario,
                        ThisItem.N in colTiempos.Bloque,
                        colPrimarioClaro,
                        RGBA(255, 255, 255, 1)
                    )
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight - 6
                  OnSelect: |-
                    =If(
                        varBloque <> ThisItem.N,
                        Collect(colTiempos, {Bloque: varBloque, Seg: DateDiff(varBloqueInicio, Now(), TimeUnit.Seconds)});
                        Set(varBloque, ThisItem.N);
                        Set(varBloqueInicio, Now())
                    )
                  PaddingLeft: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =13
                  Text: =If(ThisItem.N = 0, ThisItem.Bloque, ThisItem.N & ". " & ThisItem.Bloque)
                  Width: =Parent.TemplateWidth - 6
                  X: =0
                  Y: =0
            - btnBloqueTiempo:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =If(ThisItem.Min > 0 && LookUp(fxTiemposBloques, N = ThisItem.N).Seg > ThisItem.Min * 60, RGBA(255, 255, 255, 1), colPrimario)
                  Fill: =If(ThisItem.Min > 0 && LookUp(fxTiemposBloques, N = ThisItem.N).Seg > ThisItem.Min * 60, colRojo, varBloque = ThisItem.N, RGBA(255, 255, 255, 1), colPrimarioClaro)
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  OnSelect: |-
                    =If(
                        varBloque <> ThisItem.N,
                        Collect(colTiempos, {Bloque: varBloque, Seg: DateDiff(varBloqueInicio, Now(), TimeUnit.Seconds)});
                        Set(varBloque, ThisItem.N);
                        Set(varBloqueInicio, Now())
                    )
                  RadiusBottomLeft: =13
                  RadiusBottomRight: =13
                  RadiusTopLeft: =13
                  RadiusTopRight: =13
                  Size: =11
                  Text: |-
                    =With({u: LookUp(fxTiemposBloques, N = ThisItem.N).Seg}, If(ThisItem.Min = 0, RoundDown(u / 60, 0) & ":" & Text(Mod(u, 60), "00"), If(u = 0 && varBloque <> ThisItem.N, ThisItem.Min & "'", RoundDown(u / 60, 0) & ":" & Text(Mod(u, 60), "00") & "/" & ThisItem.Min & "'")))
                  Width: =88
                  X: =Parent.TemplateWidth - 6 - 94
                  Y: =(Parent.TemplateHeight - 6 - 26) / 2
      - btnSiguienteBloque:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: =If(varBloque < CountRows(tblBloques), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =colPrimario
            FontWeight: =FontWeight.Bold
            Height: =56
            OnSelect: |-
              =Collect(colTiempos, {Bloque: varBloque, Seg: DateDiff(varBloqueInicio, Now(), TimeUnit.Seconds)});
              Set(varBloque, varBloque + 1);
              Set(varBloqueInicio, Now())
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =16
            Text: ="Siguiente ▶"
            Width: =260
            X: =10
            Y: =galBloques.Y + galBloques.Height + 10
      - btnSalirSinCerrar:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =colPrimario
            BorderThickness: =1
            Color: =colPrimario
            Fill: =RGBA(255, 255, 255, 1)
            Height: =44
            OnSelect: =Set(varConfSalir, true)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =14
            Text: ="← Salir sin cerrar"
            Width: =260
            X: =10
            Y: =btnSiguienteBloque.Y + btnSiguienteBloque.Height + 10
      - conB0Agenda:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height - 104
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Visible: =varBloque = 0
            Width: =Parent.Width - 296
            X: =284
            Y: =88
          Children:
            - lblAgTitulo:
                Control: Label@2.5.1
                Properties:
                  Color: =colPrimario
                  FontWeight: =FontWeight.Bold
                  Height: =50
