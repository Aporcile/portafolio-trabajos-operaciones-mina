                Properties:
                  Height: =56
                  Image: ='logo_minera_demo_blanco'
                  ImagePosition: =ImagePosition.Fit
                  Width: =120
                  X: =12
                  Y: =8
            - imgLogoAreaEd:
                Control: Image@2.2.3
                Properties:
                  Height: =44
                  Image: ="data:image/png;base64,"
                  ImagePosition: =ImagePosition.Fit
                  Width: =44
                  X: =138
                  Y: =14
            - lblTituloEd:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  FontWeight: =FontWeight.Bold
                  Height: =36
                  Size: =15
                  Text: ="RD Minera Demo · " & Text(fecReunion, "ddd dd-mm", "es-ES")
                  Width: =310
                  Wrap: =false
                  X: =190
                  Y: =8
            - lblEstadoPrepEd:
                Control: Label@2.5.1
                Properties:
                  Color: =If(varPrepSucia || varEvidId <> 0 || !IsBlank(varEditNuevoEd) || !IsBlank(Trim(txtNuevoQueEd.Text)) || !IsBlank(Trim(txtNuevoRespEd.Text)) || !IsBlank(Trim(txtAvisoEd.Text)), RGBA(255, 204, 128, 1), RGBA(165, 214, 167, 1))
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  Size: =12
                  Text: |-
                    =If(
                        varPrepGuardando,
                        "Guardando…",
                        varPrepSucia || varEvidId <> 0 || !IsBlank(varEditNuevoEd) || !IsBlank(Trim(txtNuevoQueEd.Text)) || !IsBlank(Trim(txtNuevoRespEd.Text)) || !IsBlank(Trim(txtAvisoEd.Text)),
                        "● Cambios sin guardar",
                        !IsBlank(fxPrepFila),
                        // Actualizado viene como «aaaa-mm-dd hh:mm»: se muestra «dd-mm hh:mm», como en el resto de la app.
                        "✔ Guardado " & With({a: fxPrepFila.Actualizado}, If(Len(a) >= 16, Mid(a, 9, 2) & "-" & Mid(a, 6, 2) & " " & Mid(a, 12, 5), a)),
                        "Sin preparación guardada"
                    )
                  Width: =300
                  Wrap: =false
                  X: =190
                  Y: =44
            - lblSubEd:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(200, 211, 227, 1)
                  Height: =64
                  PaddingBottom: =2
                  PaddingTop: =2
                  Size: =11
                  Text: |-
                    ="Modo editor: lo que prepares se muestra en la reunión (visor)."
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 852
                  X: =506
                  Y: =4
            - btnGuardarPrepEd:
                Control: Classic/Button@2.2.0
                Properties:
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =If(varPrepGuardando, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =colAmbar
                  FontWeight: =FontWeight.Bold
                  Height: =48
                  OnSelect: |-
                    =If(
                        CountRows(Filter(colRevision, !Revisado)) > 0,
                        Set(varBloqueEd, 2);
                        Set(varSubCompEd, 1);
                        Notify("Para guardar, todos los compromisos deben tener estado. Faltan " & CountRows(Filter(colRevision, !Revisado)) & ".", NotificationType.Warning),
                        !IsBlank(varEditNuevoEd),
                        If(!(varBloqueEd = 2 && varSubCompEd = 2), Set(varBloqueEd, 2); Set(varSubCompEd, 2));
                        Notify("Termina de editar el compromiso nuevo: «Guardar cambios» o «Cancelar».", NotificationType.Warning),
                        IsBlank(Trim(txtNuevoQueEd.Text)) <> IsBlank(Trim(txtNuevoRespEd.Text)),
                        If(!(varBloqueEd = 2 && varSubCompEd = 2), Set(varBloqueEd, 2); Set(varSubCompEd, 2));
                        Notify("Al compromiso nuevo le falta qué se hará o el responsable: complétalo o bórralo.", NotificationType.Warning),
                        Set(varPrepGuardando, true);
                        // 0) Lo escrito sin confirmar: evidencia con el panel abierto, aviso sin «+ Agregar aviso» y compromiso nuevo completo.
                        If(
                            varEvidId <> 0,
                            With(
                                {f: imgEvidPreviaEd.Image, nom: If(     !IsEmpty(attEvidEd.Attachments),     First(attEvidEd.Attachments).Name,     IsBlank(addFotoEvidEd.Media),     LookUp(colEvid, CompromisoId = varEvidId).Nombre,     "" ), nuevo: (!IsEmpty(attEvidEd.Attachments) || !IsBlank(addFotoEvidEd.Media))},
                                RemoveIf(colEvid, CompromisoId = varEvidId);
                                If(!IsBlank(f), Collect(colEvid, {CompromisoId: varEvidId, Foto: f, TieneFoto: true, Nombre: nom}));
                                Patch(
                                    colRevision,
                                    LookUp(colRevision, ID = varEvidId),
                                    {
                                        Comentario: Trim(txtEvidComentarioEd.Text),
                                        Url: If(nuevo, "", LookUp(colRevision, ID = varEvidId).Url)
                                    }
                                )
                            );
                            Set(varEvidId, 0);
                            Reset(addFotoEvidEd);
                            Reset(attEvidEd);
                            Reset(txtEvidComentarioEd)
                        );
                        If(!IsBlank(Trim(txtAvisoEd.Text)), Collect(colAvisos, {Nivel: varNivelEd, Texto: Trim(txtAvisoEd.Text), Orden: Coalesce(Max(colAvisos, Orden), 0) + 1, IdLocal: Text(GUID()), Rango: Switch(varNivelEd, "Crítico", 1, "Precaución", 2, "Recordar", 3, 4)}); Reset(txtAvisoEd));
                        If(
                            !IsBlank(Trim(txtNuevoQueEd.Text)) && !IsBlank(Trim(txtNuevoRespEd.Text)),
                            Collect(colNuevos, {Titulo: Trim(txtNuevoQueEd.Text), Responsable: Trim(txtNuevoRespEd.Text), FechaLimite: dpNuevoFechaEd.SelectedDate, IdLocal: Text(GUID())});
                            Reset(txtNuevoQueEd);
                            Reset(txtNuevoRespEd);
                            Reset(dpNuevoFechaEd)
                        );
                        // seg: resumen en texto de los avisos (lo usan la sesión y las versiones anteriores del visor).
                        Set(varSeg, Concat(Sort(colAvisos, Rango * 1000 + Orden), Nivel & ": " & Texto, Char(10)));
                        // 1) Evidencias nuevas (fotos o archivos) a la carpeta Evidencias (solo con señal). Cada una se sube una vez: al subirla queda su link en Url.
                        If(
                            Connection.Connected,
                            ForAll(
                                colEvid As e,
                                If(
                                    IsBlank(LookUp(colRevision, ID = e.CompromisoId).Url),
                                    IfError(
                                        With(
                                            {u: RDSubirEvidencia.Run("Prep_" & claveReunion & "_C" & e.CompromisoId & "_" & Text(Now(), "hhmmss") & If(IsBlank(e.Nombre), ".jpg", IsBlank(Find(".", e.Nombre)), "", "." & Lower(Last(Split(e.Nombre, ".")).Value)), JSON(e.Foto, JSONFormat.IncludeBinaryData)).url},
                                            Patch(colRevision, LookUp(colRevision, ID = e.CompromisoId), {Url: u})
                                        );
                                        true,
                                        Notify("No se pudo subir una evidencia: " & FirstError.Message, NotificationType.Error);
                                        false
                                    )
                                )
                            )
                        );
                        // 2) Texto JSON de la preparación: tema de seguridad, estado de cada compromiso, destacados y compromisos nuevos.
                        Set(
                            varPrepJson,
                            JSON(
                                {
                                    seg: varSeg,
                                    avi: ForAll(colAvisos As a, {id: a.IdLocal, n: a.Nivel, x: a.Texto, o: a.Orden}),
                                    ind: {inc: Value(txtSegIncEd.Text), inca: Value(txtSegIncAntEd.Text), rep: Value(txtSegRepEd.Text), repm: Value(txtSegRepMetaEd.Text), ire: Value(txtSegInsRealEd.Text), ipl: Value(txtSegInsPlanEd.Text)},
                                    cor: User().Email,
                                    est: ForAll(colRevision As r, {id: r.ID, estado: r.EstadoNuevo, rev: r.Revisado, com: r.Comentario, url: r.Url}),
                                    des: ForAll(colDest As d, {id: d.IdLocal, t: d.Tipo, x: d.Texto, o: d.Orden}),
                                    nue: ForAll(colNuevos As n, {id: n.IdLocal, t: n.Titulo, r: n.Responsable, f: Text(n.FechaLimite, "yyyy-mm-dd")})
                                },
                                JSONFormat.Compact
                            )
                        );
                        // 3) Copia local (el visor de este equipo la lee) y subida a Excel (RD_Preparacion).
                        ClearCollect(colPrepFila, {Clave: claveReunion, Json: varPrepJson, Actualizado: Text(Now(), "yyyy-mm-dd hh:mm"), Autor: User().FullName});
                        SaveData(colPrepFila, "rd_prepfila");
                        Set(varPrepErr, "");
                        // Refresh: la lectura en memoria puede ser vieja; así no se crea una fila repetida si otro equipo ya la creó.
                        If(Connection.Connected, Refresh(RD_Preparacion));
                        Set(
                            varPrepNube,
                            Connection.Connected &&
                            IfError(
                                If(
                                    IsBlank(LookUp(RD_Preparacion, Clave = claveReunion)),
                                    Patch(RD_Preparacion, Defaults(RD_Preparacion), First(colPrepFila)),
                                    Patch(RD_Preparacion, LookUp(RD_Preparacion, Clave = claveReunion), {Json: varPrepJson, Actualizado: First(colPrepFila).Actualizado, Autor: First(colPrepFila).Autor})
                                );
                                true,
                                Set(varPrepErr, FirstError.Message);
                                false
                            )
                        );
                        If(
                            varPrepNube,
                            Clear(colOutPrep);
                            Notify("Preparación guardada.", NotificationType.Success),
                            ClearCollect(colOutPrep, First(colPrepFila));
                            Notify(If(Connection.Connected, "No se pudo guardar en la nube (" & varPrepErr & "). ", "Sin señal: ") & "La preparación quedó en este equipo y se sube sola al sincronizar.", NotificationType.Warning)
                        );
                        SaveData(colOutPrep, "rd_out_prep");
                        Set(varPrepSucia, false);
                        Set(varPrepGuardando, false)
                    )
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =14
                  Text: ="Guardar"
                  Width: =150
                  X: =Parent.Width - 318
                  Y: =12
