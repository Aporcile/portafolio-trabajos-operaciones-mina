Screens:
  scrEditor:
    Properties:
      Fill: =colFondo
      OnVisible: |-
        =If(
            !varPrepSucia || varPrepFecha <> claveReunion,
            Set(varPrepFecha, claveReunion);
            Set(varPrepSucia, false);
            ClearCollect(colRevision, fxRevision);
            Clear(colEvid);
            ClearCollect(colDest, fxDest);
            ClearCollect(
                colNuevos,
                ForAll(
                    If(IsBlank(fxPrep.nue), Table(ParseJSON("[]")), Table(fxPrep.nue)) As n,
                    {
                        Titulo: Text(n.Value.t),
                        Responsable: Text(n.Value.r),
                        FechaLimite: DateValue(Text(n.Value.f)),
                        IdLocal: Text(n.Value.id)
                    }
                )
            );
            // Sin preparación guardada, la meteorología del plan semanal parte como aviso de precaución.
            ClearCollect(colAvisos, fxAvisos);
            If(
                IsBlank(fxPrepFila) && IsEmpty(colAvisos) && !IsBlank(First(colPlan).Meteorologia),
                Collect(colAvisos, {Nivel: "Precaución", Texto: First(colPlan).Meteorologia, Orden: 1, IdLocal: Text(GUID()), Rango: 2})
            );
            Set(varIndEd, fxIndSeg)
        );
        Set(varNivelEd, "Precaución");
        Set(varBloqueEd, 1);
        Set(varSubCompEd, 1);
        Set(varEvidId, 0);
        Set(varConvEditEd, Blank());
        Set(varEditNuevoEd, Blank());
        Set(varBorrarNuevoEd, Blank())
    Children:
      - conHeaderEd:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =colPrimario
            Height: =72
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - imgLogoEd:
